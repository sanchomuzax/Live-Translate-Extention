name: Validate and publish extension

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - manifest.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and release tests
        run: |
          set -euo pipefail
          for file in ./*.js; do node --check "$file"; done
          node --test tests/*.test.cjs
      - name: Build and validate Chrome ZIP
        run: |
          set -euo pipefail
          bash -n build.sh
          bash build.sh
          VERSION="$(node -p 'require("./manifest.json").version')"
          ZIP="dist/live-translate-v$VERSION.zip"
          test -s "$ZIP"
          unzip -t "$ZIP"
          for file in manifest.json background.js content.js content.css offscreen.html offscreen.js options.html options.css options.js pcm-worklet.js icons/icon16.png icons/icon32.png icons/icon48.png icons/icon128.png; do
            unzip -Z1 "$ZIP" | grep -Fxq "$file"
          done

  publish:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build release ZIP
        run: bash build.sh
      - name: Publish tagged GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./manifest.json").version')"
          TAG="v$VERSION"
          ZIP="dist/live-translate-$TAG.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Not overwriting it."
            exit 0
          fi
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { show=1; next }
            /^## \[/ && show { exit }
            show { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "Missing changelog entry for $VERSION" >&2
            exit 1
          fi
          gh release create "$TAG" "$ZIP" \
            --target "$GITHUB_SHA" \
            --title "Live Translate $TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
